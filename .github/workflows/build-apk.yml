name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "Longitud KEYSTORE_B64: ${#KEYSTORE_B64} (debe ser 3520)"
          echo "Longitud KEYSTORE_PASS: ${#KEYSTORE_PASS} (debe ser 24)"
          echo "Empieza por: ${KEYSTORE_B64:0:4}"
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > app/release.jks
          ls -l app/release.jks

      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Hemeroteca.apk

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Hemeroteca.apk \
            --title "Hemeroteca $TAG" \
            --notes "Descarga Hemeroteca.apk desde el móvil e instálala encima de la anterior." \
            --latest
