<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemeroteca de entrenos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet">
<style>
/* Dirección: "discos de halterofilia". App clara y limpia; el único gesto fuerte es el código de color de los discos (verde 10 · amarillo 15 · azul 20 · rojo 25): la intensidad de cada esquema se dibuja como placas cargadas en una barra, y los tipos de WOD usan el mismo código. Navegación por pasos abajo, al alcance del pulgar. */
:root{
  --bg:#f2f2ee;
  --card:#ffffff;
  --ink:#131518;
  --muted:#60656c;
  --faint:#9a9ea4;
  --rule:#e3e3dd;
  --soft:#ebebe6;
  --p-green:#1f9a55; --p-yellow:#e2ad00; --p-blue:#1e5bd0; --p-red:#d63a2b; --p-black:#131518;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1114;--card:#181b20;--ink:#eef0f3;--muted:#a1a6ae;--faint:#6c7179;--rule:#262a31;--soft:#20242a;
    --p-green:#35b86d;--p-yellow:#f0c02a;--p-blue:#4f86ef;--p-red:#ee5a49;--p-black:#eef0f3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1114;--card:#181b20;--ink:#eef0f3;--muted:#a1a6ae;--faint:#6c7179;--rule:#262a31;--soft:#20242a;
  --p-green:#35b86d;--p-yellow:#f0c02a;--p-blue:#4f86ef;--p-red:#ee5a49;--p-black:#eef0f3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--p-blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 130px}

/* cabecera */
.hero{padding:28px 0 6px;display:grid;gap:14px}
.eyebrow{margin:0;font-size:.78rem;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;display:block}
h1{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(2.2rem,8vw,3.4rem);line-height:.98;letter-spacing:-.025em;margin:0;text-wrap:balance}
.heroRow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.stats{display:flex;gap:22px}
.stat b{display:block;font-stretch:125%;font-weight:800;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.btn{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35;cursor:default}
.sub{display:none}

h2{font-stretch:125%;font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.1;margin:26px 0 6px;text-wrap:balance}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 14px;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin:-4px 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:6px;height:14px;border-radius:2px;display:block}

/* selectores */
.chips{display:flex;gap:6px;margin:8px 0 10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrapit{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:.86rem;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.chip small{color:var(--faint);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.6}
.chip .sw{width:8px;height:8px;border-radius:50%}

.sheet{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:18px}
.list{display:grid;gap:10px}
.lift h3,.wod h3,.acc h3{font-stretch:112%;font-weight:700;font-size:1.15rem;letter-spacing:-.01em;line-height:1.2;margin:0}
.liftHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rm{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.rm input{width:86px;padding:7px 10px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rm input::placeholder{color:var(--faint);font-weight:400}
.desc{color:var(--muted);font-size:.86rem;margin:4px 0 12px}
.schemes{display:grid;gap:6px}
.scheme{display:grid;grid-template-columns:84px 1fr 24px;gap:12px;align-items:center;text-align:left;border:1px solid transparent;background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer}
.scheme:hover{border-color:var(--rule)}
.scheme[aria-pressed="true"]{background:var(--card);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.txt{display:grid;gap:1px;min-width:0}
.tag{font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.sets{font-variant-numeric:tabular-nums;font-size:.92rem;font-weight:500}
.kg{font-weight:700}
.mark{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:.75rem;color:transparent}
.scheme[aria-pressed="true"] .mark{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* barra con discos */
.barbell{position:relative;height:40px;display:flex;align-items:center;gap:2px;padding-left:10px}
.barbell::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--faint);border-radius:2px;opacity:.55}
.barbell::after{content:"";position:absolute;left:6px;top:50%;width:3px;height:12px;margin-top:-6px;background:var(--faint);border-radius:1px}
.plate{position:relative;width:6px;border-radius:2px;flex:none}
.plate.g{background:var(--p-green)}.plate.y{background:var(--p-yellow)}.plate.b{background:var(--p-blue)}.plate.r{background:var(--p-red)}
.barbell.free span{position:relative;font-size:.7rem;font-weight:700;color:var(--muted);background:var(--bg);padding:0 4px;margin-left:4px}
.scheme[aria-pressed="true"] .barbell.free span{background:var(--card)}

/* WOD */
.wod{position:relative;overflow:hidden;padding-left:22px}
.wod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cc,var(--faint))}
.wod.cardio{--cc:var(--p-green)}.wod.fuerza{--cc:var(--p-red)}.wod.mixto{--cc:var(--p-blue)}.wod.gimnastico{--cc:var(--p-yellow)}.wod.core{--cc:var(--faint)}
.wodTop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.dur{text-align:right}
.dur b{display:block;font-stretch:125%;font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.dur span{font-size:.72rem;color:var(--muted);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 0;align-items:center}
.pill{font-size:.76rem;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.cat{color:var(--ink);font-weight:600}
.pill.cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
.pill.warn{color:var(--p-red);font-weight:600}
.moves{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--rule);list-style:none;font-size:.95rem;display:grid;gap:4px}
.moves li.sub{color:var(--muted);font-size:.8rem;font-weight:600;margin-top:4px}
.moves li.sub:first-child{margin-top:0}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.foot .rx{flex:1;min-width:0}
.rx{font-size:.8rem;color:var(--muted)}
.rx b{color:var(--ink);font-weight:700;margin-right:6px}
.pick{flex:none;padding:8px 14px;font-size:.84rem}
.wod.on,.acc.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.acc .meta{margin-top:6px}
.accRow{display:flex;justify-content:space-between;gap:12px;align-items:center}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.search{flex:1;min-width:170px;padding:11px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--card)}
.search::placeholder{color:var(--faint)}
.count{color:var(--muted);font-size:.82rem;margin:0 0 10px}
.summary{display:grid;gap:10px}
.block h3{font-size:.78rem;font-weight:600;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.block h3 b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.7rem}
.block .row>div>b{font-weight:700;font-size:1.05rem}
.empty{color:var(--faint);margin:0;font-size:.9rem}
.note{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--p-red);border-radius:12px;padding:12px 14px;font-size:.9rem}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;padding:6px 0}
.row+.row{border-top:1px solid var(--rule)}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:.8rem;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
textarea{width:100%;min-height:200px;border:1px solid var(--rule);border-radius:12px;background:var(--card);padding:12px;font-size:.88rem}
.total{display:flex;gap:10px;align-items:baseline;margin:0 0 8px}
.total b{font-stretch:125%;font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.total span{color:var(--muted);font-size:.86rem}

/* navegación inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
nav.tabs button{background:transparent;border:0;border-radius:12px;padding:8px 4px;cursor:pointer;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs .k{font-size:.68rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--faint)}
nav.tabs .l{font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button[aria-selected="true"] .k{color:inherit;opacity:.6}
nav.tabs .n{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:99px;background:var(--p-red);color:#fff;font-size:.65rem;font-weight:700;padding:0 4px}
.dock{display:none}
/* registro e historial */
.field{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.field:focus{border-color:var(--ink);outline:none}
.lbl{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
.form{display:grid;gap:10px}
.logset{display:grid;grid-template-columns:34px 1fr 1fr 74px;gap:8px;align-items:center;padding:4px 0}
.logset.hd{font-size:.72rem;color:var(--muted);font-weight:600;padding-bottom:0}
.logset .s{font-weight:700;color:var(--muted);font-size:.85rem}
.logset .prev{font-size:.75rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 120px;gap:8px}
.upd{display:block;margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:.9rem}
.ok{color:var(--p-green);font-weight:600;font-size:.9rem;margin:0 0 10px}
.rmtable{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.rmtable td,.rmtable th{padding:7px 4px;border-bottom:1px solid var(--rule);text-align:left}
.rmtable th{font-size:.72rem;color:var(--muted);font-weight:600}
.rmtable td.n{text-align:right;font-weight:700}
.entry h3{font-size:1rem;font-weight:700;margin:0}
.entry .day{font-size:.78rem;color:var(--muted);font-weight:600;display:inline-block}
.entry .day::first-letter{text-transform:uppercase}
.entry p{margin:6px 0 0;font-size:.9rem}
.entry p b{font-weight:600}
.danger{color:var(--p-red)}
.ver{color:var(--faint);font-size:.75rem;margin-top:18px}
nav.tabs .n[hidden]{display:none}

@media (prefers-reduced-motion: no-preference){
  .chip,.scheme,.btn,.sheet,nav.tabs button{transition:background .15s,border-color .15s,box-shadow .15s,color .15s}
  .scheme[aria-pressed="true"] .plate{animation:load .3s ease-out both}
  @keyframes load{from{transform:scaleY(.6)}to{transform:none}}
}
@media (max-width:440px){
  .scheme{grid-template-columns:70px 1fr 22px;gap:10px}
  .stats{gap:16px}
}
</style>
</head>

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function isoWeek(s){const d=new Date(s+'T12:00:00');const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));const w=Math.ceil(((t-y)/864e5+1)/7);return t.getUTCFullYear()+'-S'+String(w).padStart(2,'0')}
const fmtDay=s=>{try{return new Date(s+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
function pushRm(id,val){const v=parseFloat(String(val).replace(',','.'));if(!v)return;const it=allLifts().find(x=>x.id===id);const last=[...st.rmh].reverse().find(r=>r.id===id);
  if(last&&last.kg===v&&last.d===today())return; if(last&&last.d===today()){last.kg=v}else st.rmh.push({d:today(),id,n:it.n,kg:v}); saveLog()}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const allLifts=()=>FUERZA.flatMap(g=>g.items.map(it=>({...it,g:g.g})));
const kg=(rm,p)=>Math.round(rm*p/100*2)/2;
function setsTxt(lift,sc){
  const rm=parseFloat(st.rm[lift.id]);
  if(!sc.sets||!rm) return esc(sc.txt);
  return sc.sets.map(([s,r,p])=>`${s}×${r} @${p}% <span class="kg">${kg(rm,p)} kg</span>`).join(' · ');
}
function plates(sc){
  if(!sc.sets) return '<span class="barbell free" aria-hidden="true"><i class="plate g" style="height:14px"></i><i class="plate y" style="height:20px"></i><i class="plate r" style="height:30px"></i><span>RM</span></span>';
  const out=[];sc.sets.forEach(([s,r,p])=>{for(let k=0;k<s&&out.length<8;k++)out.push(p)});
  return '<span class="barbell" aria-hidden="true">'+out.map(p=>{const c=p<70?'g':p<80?'y':p<90?'b':'r';const hgt=Math.round(12+(Math.min(p,102)-50)*0.5);return `<i class="plate ${c}" style="height:${hgt}px"></i>`}).join('')+'</span>';
}

    return `<article class="sheet lift"><div class="liftHead"><h3>${esc(it.n)}</h3>
      <label class="rm" for="rm-${it.id}">Tu RM <input id="rm-${it.id}" inputmode="decimal" data-rm="${it.id}" value="${esc(st.rm[it.id]||'')}" placeholder="kg"></label></div>
      <p class="desc">${esc(it.d)}</p><div class="schemes">${sch}</div></article>`}).join('');
  return `<h2>¿Qué quieres de fuerza?</h2>

function expand(sc){
  if(sc.sets){const o=[];sc.sets.forEach(([s,r,p])=>{for(let k=0;k<s;k++)o.push({reps:r,pct:p})});return o}
  const m=sc.txt.match(/^(\d+)×(\d+)/);if(m)return Array.from({length:+m[1]},()=>({reps:+m[2],pct:null}));
  const n=(sc.txt.match(/^[\d-]+/)||[''])[0].split('-').filter(Boolean);if(n.length)return n.map(r=>({reps:+r,pct:null}));
  return [{reps:'',pct:null},{reps:'',pct:null},{reps:'',pct:null}];
}

function exportXlsx(){

  const L=[...st.log].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  L.forEach(e=>e.fuerza.forEach(f=>f.sets.forEach(s=>series.push([e.fecha,isoWeek(e.fecha),f.n,f.esquema,f.fase,s.serie,s.reps,s.pct?s.pct/100:null,s.prev,s.kg,f.rm]))));
  const prog={};L.forEach(e=>e.fuerza.forEach(f=>f.sets.forEach(s=>{const k=isoWeek(e.fecha)+'|'+f.n;const p=prog[k]||(prog[k]={w:isoWeek(e.fecha),n:f.n,best:0,sets:0,vol:0});p.sets++;if(s.kg){p.best=Math.max(p.best,s.kg);p.vol+=s.kg*(s.reps||0)}})));
  const progreso=[['Semana','Ejercicio','Mejor kg','Series','Volumen (kg×reps)']].concat(Object.values(prog).map(p=>[p.w,p.n,p.best||null,p.sets,p.vol||null]));
  const wods=[['Fecha','Semana','WOD','Tipo','Formato','Min','Resultado','Rx / Escalado','Pesos y notas','Fecha original del cuaderno']];
  L.forEach(e=>e.wods.forEach(w=>wods.push([e.fecha,isoWeek(e.fecha),w.n,w.cat,w.fmt,w.min,w.res,w.rx,w.nota,w.f])));
  const acc=[['Fecha','Superserie','Series / reps','Kg y notas']];L.forEach(e=>{if(e.acc)acc.push([e.fecha,e.acc.n,e.acc.r,e.acc.nota])});
  const ses=[['Fecha','Semana','Fuerza','WOD','Notas']];L.forEach(e=>ses.push([e.fecha,isoWeek(e.fecha),e.fuerza.map(f=>f.n).join(' + '),e.wods.map(w=>w.n).join(' + '),e.notas]));
  const rmh=[['Fecha','Ejercicio','RM (kg)']].concat([...st.rmh].sort((a,b)=>a.d.localeCompare(b.d)).map(r=>[r.d,r.n,r.kg]));
  const rmAct=[['Ejercicio','RM actual (kg)']].concat(allLifts().filter(it=>st.rm[it.id]).map(it=>[it.n,parseFloat(String(st.rm[it.id]).replace(',','.'))]));
  const wb=XLSX.utils.book_new();
  const add=(name,rows,widths,pctCol)=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=widths.map(w=>({wch:w}));if(rows.length>1)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:rows[0].length-1}})};
    if(pctCol!=null)for(let r=1;r<rows.length;r++){const c=ws[XLSX.utils.encode_cell({r,c:pctCol})];if(c&&c.t==='n')c.z='0%'}
    XLSX.utils.book_append_sheet(wb,ws,name)};
  add('Sesiones',ses,[11,10,30,36,40]);add('Series',series,[11,10,18,30,11,6,6,7,11,9,10],7);add('Progreso semanal',progreso,[10,18,10,8,16]);
  add('WODs',wods,[11,10,28,18,10,6,14,12,30,12]);add('Superseries',acc,[11,44,14,30]);add('Historial RM',rmh,[11,18,9]);add('RM actuales',rmAct,[18,14]);

    else{XLSX.writeFile(wb,name);st.flash='Excel descargado: '+name}
  }catch(err){st.flash='No se pudo crear el Excel: '+err.message}
  render();
}

  const d=t.dataset;
  if(d.tab){st.tab=d.tab;st.del=null;render();window.scrollTo(0,0);return}
  if(t.id==='logStart'){st.tab='registrar';render();window.scrollTo(0,0);return}
  if(t.id==='saveLog'){saveEntry();render();window.scrollTo(0,0);return}
  if(t.id==='exportX'){exportXlsx();return}
  if(t.id==='addRm'){const id=$('#newRmLift').value,v=$('#newRmKg').value.replace(',','.');if(parseFloat(v)){st.rm[id]=v;saveRM();pushRm(id,v);st.flash='RM guardado.'}render();return}
  if(d.del){st.del=+d.del;render();return}
  if(d.delno){st.del=null;render();return}
  if(d.delok){st.log=st.log.filter(e=>e.id!==+d.delok);st.del=null;saveLog();st.flash='Entreno borrado.';render();return}
  if(d.grp){st.grp=d.grp}
  else if(d.lift){const i=+d.i,g=allLifts().find(x=>x.id===d.lift).g;
    const k=st.fuerza.findIndex(f=>f.id===d.lift);
    if(k>=0&&st.fuerza[k].i===i)st.fuerza.splice(k,1);
    else if(k>=0)st.fuerza[k].i=i;
    else{if(st.fuerza.length>=2)st.fuerza.shift();st.fuerza.push({id:d.lift,i,g})}}
  else if(d.accz){st.accZ=d.accz}
  else if(d.acc!==undefined){const i=+d.acc;st.acc=st.acc===i?null:i}
  else if(d.cat){st.cat=d.cat}
  else if(d.fmt){st.fmt=d.fmt}
  else if(d.dur){st.dur=d.dur}
  else if(d.tog){st[d.tog]=!st[d.tog]}
  else if(d.wod){const k=st.wods.indexOf(d.wod);if(k>=0)st.wods.splice(k,1);else{if(st.wods.length>=2)st.wods.shift();st.wods.push(d.wod)}}
  else if(d.rmf!==undefined){st.fuerza.splice(+d.rmf,1)}
  else if(d.rmacc){st.acc=null}
  else if(t.id==='rndWod'){const l=filtered();const w=l[Math.floor(Math.random()*l.length)];if(w&&!st.wods.includes(w.id)){if(st.wods.length>=2)st.wods.shift();st.wods.push(w.id)}st.tab='sesion'}
  else if(t.id==='goSession'){st.tab='sesion';render();window.scrollTo(0,0);return}
  else if(t.id==='reset'){st.fuerza=[];st.acc=null;st.wods=[]}
  else if(t.id==='randomAll'){randomAll()}
  else if(t.id==='copy'){copySession();return}
  else return;
  const y=window.scrollY;render();if(!['randomAll','rndWod','reset'].includes(t.id))window.scrollTo(0,y);else window.scrollTo(0,0);
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.rm)pushRm(e.target.dataset.rm,e.target.value)});
document.addEventListener('input',e=>{
  if(e.target.dataset.rm){const id=e.target.dataset.rm;const v=e.target.value.replace(',','.');st.rm[id]=v;saveRM();
    const art=e.target.closest('article');const it=allLifts().find(x=>x.id===id);
    art.querySelectorAll('.scheme').forEach(b=>{b.querySelector('.sets').innerHTML=setsTxt(it,it.sch[+b.dataset.i])});}
  if(e.target.id==='q'){st.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
});
function randomAll(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const lifts=allLifts();
  const a=pick(lifts);
  const pair={Pierna:['dip','pu'],Cargada:['pu','dip'],Complex:['pu','dip'],Bisagra:['pu'],Tirón:['dip','bsq'],Empuje:['bsq','fsq']}[a.g];
  const b=lifts.find(x=>x.id===pick(pair));
  st.fuerza=[{id:a.id,i:Math.floor(Math.random()*a.sch.length),g:a.g},{id:b.id,i:Math.floor(Math.random()*b.sch.length),g:b.g}];
  st.acc=Math.floor(Math.random()*ACC.length);
  const heavy=['Cargada','Complex','Bisagra'].includes(a.g);
  const main=W.filter(w=>w.cat!=='core'&&(!heavy||!w.hinge));
  st.wods=[pick(main.length?main:W).id,pick(W.filter(w=>w.cat==='core')).id];
  st.tab='sesion';
}
function copySession(){
  const txt=sessionText();const ta=$('#txt');ta.value=txt;
  try{navigator.clipboard.writeText(txt).then(()=>{$('#copyMsg').textContent='Copiada. Pégala donde quieras.'},()=>{ta.hidden=false;ta.select();$('#copyMsg').textContent='Selecciona el texto y cópialo.'})}
  catch(e){ta.hidden=false;ta.select();$('#copyMsg').textContent='Selecciona el texto y cópialo.'}
}
